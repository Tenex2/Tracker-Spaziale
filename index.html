<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EME Tracker - IK0EQJ</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --accent-yellow: #ffee00;
      --accent-blue: #00d2ff;
      --accent-green: #00ff66;
      --accent-red: #ff3366;
      --accent-orange: #ff9900;
      --text-dim: #8a94a6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232a3b;
      padding-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--accent-blue);
      text-transform: uppercase;
    }

    .displays-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .display-card {
      background: var(--card-bg);
      border: 1px solid #232a3b;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .display-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .display-value-box {
      background: #05070a;
      border: 2px solid #1c2333;
      border-radius: 8px;
      width: 100%;
      padding: 15px 0;
      text-align: center;
    }

    .display-value {
      font-family: 'Courier New', monospace;
      font-size: 3.5rem;
      font-weight: bold;
      color: var(--accent-yellow);
      text-shadow: 0 0 12px rgba(255, 238, 0, 0.4);
    }

    .display-unit { font-size: 2rem; color: var(--accent-yellow); }

    .offset-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .control-card {
      background: var(--card-bg);
      border: 1px solid #232a3b;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .input-group { display: flex; align-items: center; gap: 6px; }

    label { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; }

    input, select {
      background: #0b0e14;
      border: 1px solid #232a3b;
      border-radius: 6px;
      color: #fff;
      padding: 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    button {
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .btn-action { background: var(--accent-blue); color: #000; }
    .btn-start { background: var(--accent-green); color: #000; }
    .btn-stop { background: var(--accent-red); color: #fff; }
    .btn-secondary { background: #232a3b; color: #fff; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .jog-container {
      background: var(--card-bg);
      border: 1px solid #232a3b;
      border-radius: 12px;
      padding: 15px;
    }

    .jog-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .btn-jog {
      background: #1c2333;
      border: 1px solid #323b52;
      color: var(--accent-blue);
      padding: 15px;
      font-size: 1rem;
      font-weight: bold;
    }

    #serial-log {
      background-color: #05070a;
      border: 1px solid #1c2333;
      border-radius: 6px;
      height: 120px;
      overflow-y: auto;
      padding: 10px;
      font-family: 'Consolas', monospace;
      font-size: 0.85rem;
      color: var(--accent-green);
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #232a3b;
      color: var(--text-dim);
    }
    .status-active { background: rgba(0, 255, 102, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .status-waiting { background: rgba(255, 153, 0, 0.15); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
  </style>
</head>
<body>

  <header>
    <h1>EME Tracker <span style="font-size: 0.8rem; color: var(--text-dim);">[IK0EQJ]</span></h1>
    <div id="conn-status" class="status-badge">DISCONNESSO</div>
  </header>

  <div class="displays-grid">
    <!-- CARD AZIMUT -->
    <div class="display-card">
      <div class="display-title">Azimut (AZ)</div>
      <div class="display-value-box">
        <span id="az-display" class="display-value">000.0000</span><span class="display-unit">°</span>
      </div>
      <div class="offset-container">
        <label for="az-offset">Offset AZ (°):</label>
        <input type="number" id="az-offset" value="0.00" step="0.01" style="width: 70px;">
      </div>
    </div>

    <!-- CARD ELEVAZIONE -->
    <div class="display-card">
      <div class="display-title">Elevazione (EL)</div>
      <div class="display-value-box">
        <span id="el-display" class="display-value">00.0000</span><span class="display-unit">°</span>
      </div>
      <div class="offset-container">
        <label for="el-offset">Offset EL (°):</label>
        <input type="number" id="el-offset" value="0.00" step="0.01" style="width: 70px;">
      </div>
    </div>
  </div>

  <div class="control-card">
    <div class="input-row">
      <div class="input-group">
        <label>Target:</label>
        <select id="target-id" style="color: var(--accent-blue); font-weight: bold;">
          <option value="301">Luna (Moon)</option>
          <option value="10">Sole (Sun)</option>
          <option value="-31">Voyager 1</option>
          <option value="-32">Voyager 2</option>
          <option value="499">Marte (Mars)</option>
          <option value="299">Venere (Venus)</option>
          <option value="-98">New Horizons</option>
          <option value="599">Giove (Jupiter)</option>
          <option value="-61">Juno</option>
          <option value="-28">Juice (ESA)</option>
          <option value="-152">Europa Clipper</option>
          <option value="-224">Psyche (Sonda/Asteroide)</option>
          <option value="-161">Lucy</option>
          <option value="-188">Hera (ESA)</option>
          <option value="-214">Hayabusa2</option>
          <option value="199">Mercurio (Mercury)</option>
          <option value="-121">BepiColombo (ESA/JAXA)</option>
          <option value="-203">Parker Solar Probe</option>
          <option value="-144">Solar Orbiter (ESA)</option>
          <option value="-230">Akatsuki (JAXA)</option>
</select>
      </div>

      <div class="input-group">
        <label>Locator (10 ch):</label>
        <input type="text" id="locator" value="JN61FO67GW" style="width: 115px; text-transform: uppercase;" maxlength="10">
        <button class="btn-action" onclick="setLocator()">SET</button>
      </div>

      <div class="input-group">
        <label>Lat/Lon:</label>
        <span id="coords-text" style="font-size: 0.85rem; color: var(--accent-yellow); font-family: monospace;">41.900000, 12.490000</span>
      </div>
    </div>
  </div>

  <div class="jog-container">
    <div style="font-size: 0.85rem; color: var(--text-dim); font-weight: bold;">MOVIMENTO MANUALE</div>
    <div class="jog-grid">
      <button class="btn-jog" onclick="manualStep('AZ', -1.0)">◀ CCW (Az-)</button>
      <button class="btn-jog" onclick="manualStep('AZ', 1.0)">CW (Az+) ▶</button>
      <button class="btn-jog" onclick="manualStep('EL', 1.0)">▲ UP (El+)</button>
      <button class="btn-jog" onclick="manualStep('EL', -1.0)">▼ DOWN (El-)</button>
    </div>
  </div>

  <div id="serial-log">In attesa di connessione USB...</div>

  <div class="control-card" style="flex-direction: row; justify-content: space-between;">
    <button class="btn-action" onclick="connectSerial()">Connetti USB</button>
    <button id="btn-track" class="btn-start" onclick="toggleTracking()" disabled>START TRACCIAMENTO</button>
    <button class="btn-secondary" id="btn-rst" onclick="sendReset()" disabled>Azzeramento Posizione (0°, 0°)</button>
  </div>

  <script>
    let port, writer;
    let isTracking = false;
    let trackTimer = null;

    let currentLat = 41.9000;
    let currentLon = 12.4900;

    let currentVirtualAZ = 0.0;
    let currentVirtualEL = 0.0;

    function locatorToLatLon(grid) {
      grid = grid.toUpperCase().trim();
      if (grid.length < 4) return { lat: 0, lon: 0 };

      let lon = (grid.charCodeAt(0) - 65) * 20 - 180;
      let lat = (grid.charCodeAt(1) - 65) * 10 - 90;

      lon += (grid.charCodeAt(2) - 48) * 2;
      lat += (grid.charCodeAt(3) - 48) * 1;

      if (grid.length >= 6) {
        lon += (grid.charCodeAt(4) - 65) * (2 / 24) + (1 / 24);
        lat += (grid.charCodeAt(5) - 65) * (1 / 24) + (0.5 / 24);
      } else {
        return { lat: lat + 0.5, lon: lon + 1 };
      }

      if (grid.length >= 8) {
        lon -= (1 / 24);
        lat -= (0.5 / 24);

        lon += (grid.charCodeAt(6) - 48) * (2 / 240) + (1 / 240);
        lat += (grid.charCodeAt(7) - 48) * (1 / 240) + (0.5 / 240);
      } else {
        return { lat: lat, lon: lon };
      }

      if (grid.length >= 10) {
        lon -= (1 / 240);
        lat -= (0.5 / 240);

        lon += (grid.charCodeAt(8) - 65) * (2 / 5760) + (1 / 5760);
        lat += (grid.charCodeAt(9) - 65) * (1 / 5760) + (0.5 / 5760);
      }

      return { lat: lat, lon: lon };
    }

    function setLocator() {
      const loc = document.getElementById('locator').value.trim();
      if (loc.length >= 4) {
        const coords = locatorToLatLon(loc);
        currentLat = coords.lat;
        currentLon = coords.lon;
        document.getElementById('coords-text').innerText = `${currentLat.toFixed(6)}, ${currentLon.toFixed(6)}`;
        log(`Locator impostato: ${loc.toUpperCase()} -> Lat: ${currentLat.toFixed(6)}, Lon: ${currentLon.toFixed(6)}`);
      } else {
        log('Errore: Inserisci un Maidenhead Locator valido.');
      }
    }

    window.onload = () => {
      setLocator();
      updateDisplays(0.0, 0.0);
    };

    function updateDisplays(az, el) {
      currentVirtualAZ = parseFloat(az);
      currentVirtualEL = parseFloat(el);
      document.getElementById('az-display').innerText = currentVirtualAZ.toFixed(4).padStart(8, '0');
      document.getElementById('el-display').innerText = currentVirtualEL.toFixed(4).padStart(7, '0');
    }

    function setStatus(text, type) {
      const statusDiv = document.getElementById('conn-status');
      statusDiv.innerText = text;
      statusDiv.className = `status-badge status-${type}`;
    }

    function log(msg) {
      const logDiv = document.getElementById('serial-log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div>[${time}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function connectSerial() {
      if (!('serial' in navigator)) {
        log('ATTENZIONE: Web Serial API non supportata da questo browser. Usa Chrome o MS Edge.');
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        setStatus('CONNESSO', 'active');
        document.getElementById('btn-track').disabled = false;
        document.getElementById('btn-rst').disabled = false;
        log('Connesso ad Arduino via USB.');
      } catch (err) {
        log('Errore Seriale: ' + err);
      }
    }

    function getJPLFormattedDate(date) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getUTCFullYear()}-${pad(date.getUTCMonth() + 1)}-${pad(date.getUTCDate())} ${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}`;
    }

    async function fetchJPLData() {
      if (!isTracking) return;

      const target = document.getElementById('target-id').value;
      const azOffset = parseFloat(document.getElementById('az-offset').value) || 0;
      const elOffset = parseFloat(document.getElementById('el-offset').value) || 0;

      const now = new Date();
      const nextMin = new Date(now.getTime() + 2 * 60000);

      const startTime = getJPLFormattedDate(now);
      const stopTime = getJPLFormattedDate(nextMin);

      setStatus('ATTESA DATI JPL...', 'waiting');

      const params = new URLSearchParams({
        'format': 'text',
        'COMMAND': `'${target}'`,
        'OBJ_DATA': "'NO'",
        'MAKE_EPHEM': "'YES'",
        'EPHEM_TYPE': "'OBSERVER'",
        'CENTER': "'coord@399'",
        'COORD_TYPE': "'GEODETIC'",
        'SITE_COORD': `'${currentLon.toFixed(6)},${currentLat.toFixed(6)},0.05'`,
        'START_TIME': `'${startTime}'`,
        'STOP_TIME': `'${stopTime}'`,
        'STEP_SIZE': "'1m'",
        'QUANTITIES': "'4'"
      });

      const directUrl = `https://ssd.jpl.nasa.gov/api/horizons.api?${params.toString()}`;

      try {
        const response = await fetch(directUrl);
        if (response.ok) {
          const rawText = await response.text();
          if (rawText && rawText.includes("$$SOE")) {
            const lines = rawText.split('\n');
            let dataLine = "";
            let isDataSection = false;

            for (let line of lines) {
              if (line.includes("$$SOE")) { isDataSection = true; continue; }               if (line.includes("$$EOE")) { break; }
              if (isDataSection && line.trim().length > 0) {
                dataLine = line;
                break;
              }
            }

            if (dataLine) {
              const parts = dataLine.trim().split(/\s+/);
              let rawAZ = parseFloat(parts[3]);
              let rawEL = parseFloat(parts[4]);

              if (!isNaN(rawAZ) && !isNaN(rawEL)) {
                let finalAZ = (rawAZ + azOffset + 360) % 360;
                let finalEL = rawEL + elOffset;

                updateDisplays(finalAZ, finalEL);
                sendToArduino(finalAZ, finalEL);
                setStatus('TRACCIAMENTO ATTIVO', 'active');
                log(`JPL OK -> AZ: ${finalAZ.toFixed(2)}°, EL: ${finalEL.toFixed(2)}°`);
              }
            }
          }
        }
      } catch (err) {
        log("Errore di rete / CORS: Disabilita il blocco CORS sul browser.");
        setStatus('ERRORE RETE', 'waiting');
      }

      if (isTracking) {
        trackTimer = setTimeout(fetchJPLData, 6000);
      }
    }

    async function sendToArduino(az, el) {
      if (!writer) return;
      const safeEl = Math.max(0, el).toFixed(2);
      const command = `AZ:${az.toFixed(2)},EL:${safeEl}\n`;
      try {
        const encoder = new TextEncoder();
        await writer.write(encoder.encode(command));
      } catch (err) {
        log("Errore invio seriale: " + err.message);
      }
    }

    function manualStep(axis, delta) {
      if (isTracking) return;

      if (axis === 'AZ') {
        currentVirtualAZ = (currentVirtualAZ + delta + 360) % 360;
      } else if (axis === 'EL') {
        currentVirtualEL = Math.min(Math.max(currentVirtualEL + delta, 0), 90);
      }

      updateDisplays(currentVirtualAZ, currentVirtualEL);
      sendToArduino(currentVirtualAZ, currentVirtualEL);
      log(`Jog Manuale -> AZ: ${currentVirtualAZ.toFixed(2)}°, EL: ${currentVirtualEL.toFixed(2)}°`);
    }

    function sendReset() {
      updateDisplays(0.0, 0.0);
      sendToArduino(0.0, 0.0);
      log("Azzeramento Posizione inviato (AZ: 0.00°, EL: 0.00°).");
    }

    function toggleTracking() {
      const btn = document.getElementById('btn-track');
      isTracking = !isTracking;

      if (isTracking) {
        btn.innerText = 'STOP TRACCIAMENTO';
        btn.className = 'btn-stop';
        fetchJPLData();
      } else {
        btn.innerText = 'START TRACCIAMENTO';
        btn.className = 'btn-start';
        if (trackTimer) clearTimeout(trackTimer);
        setStatus('CONNESSO', 'active');
        log('Tracciamento fermato.');
      }
    }
  </script>
</body>
</html>
